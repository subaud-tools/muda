# .tools family standard: identical in every family repo except the branch
# list and the gate's OS list. The same checks `just verify` runs locally.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      matrix:
        # muda ships for darwin and linux; its tests run on both.
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4.0.0
      - run: just prepare
      - uses: subaud-tools/tools-actions/go-ci@v0.13.0
        with:
          setup-go: "false"
  extra:
    runs-on: ubuntu-26.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          # extra builds nothing: only `gate` may save the shared setup-go key,
          # or a near-empty entry wins the save race and every run builds cold.
          cache: false
      - uses: extractions/setup-just@v4.0.0
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint.tar.gz actionlint
          actionlint -version
      # The page (internal/web) is TypeScript: verify-extra runs its gate and the
      # committed-bundle freshness check.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/web/package-lock.json
      # setup-node's `cache: npm` caches the download cache, not node_modules.
      # Keyed on the lockfile: a hit lets `_web-deps` skip `npm ci`.
      - name: Cache web node_modules
        uses: actions/cache@v6
        with:
          path: internal/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('internal/web/package-lock.json') }}
      - run: just verify-extra

  # The page in a real headless chromium (`just verify-slow`): too slow for the
  # push gate, so its own job.
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/web/package-lock.json
      - name: Cache web node_modules
        uses: actions/cache@v6
        with:
          path: internal/web/node_modules
          key: web-node-modules-${{ runner.os }}-${{ hashFiles('internal/web/package-lock.json') }}
      - name: Install web dependencies
        working-directory: internal/web
        run: "[ -d node_modules ] || npm ci"
      # playwright-core's own CLI (the version that launches), and the headless
      # shell, which is what chromium.launch() actually runs.
      - name: Install chromium
        working-directory: internal/web
        run: node node_modules/playwright-core/cli.js install --with-deps chromium chromium-headless-shell
      - run: just verify-slow
